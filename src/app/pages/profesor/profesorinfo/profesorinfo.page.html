<ion-header>
  <ion-toolbar color="primary">
    <ion-title class="ion-text-center">Perfil del Profesor</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col size="12">
        <ion-card class="profile-card" *ngIf="usuario">
          <ion-card-header class="ion-text-center">
            <ion-avatar class="profile-avatar">
              <img src="https://i.pravatar.cc/150?img=3" alt="Avatar">
            </ion-avatar>
            <ion-card-title>{{ usuario.name }}</ion-card-title>
            <ion-card-subtitle>{{ usuario.tipo | titlecase }}</ion-card-subtitle>
          </ion-card-header>
          <ion-card-content>
            <ion-list>
              <ion-item lines="none">
                <ion-icon slot="start" name="mail-outline"></ion-icon>
                <ion-label>Email</ion-label>
                <p>{{ usuario.email }}</p>
              </ion-item>
            </ion-list>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="12">
        <ion-button expand="block" color="danger" (click)="logout()">
          <ion-icon slot="start" name="log-out-outline"></ion-icon>
          Cerrar Sesión
        </ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
