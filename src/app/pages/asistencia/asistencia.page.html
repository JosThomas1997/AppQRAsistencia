<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>Asistencia</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-button expand="block" (click)="startScan()">Iniciar Escaneo</ion-button>

  <div *ngIf="isScanning" class="scanning-message">
    <p>Apunta la cámara hacia el código QR...</p>
  </div>

  <div *ngIf="scannedValue">
    <h3>Valor Escaneado:</h3>
    <p>{{ scannedValue }}</p>
    <ion-button expand="block" (click)="clearScannedValue()">Limpiar</ion-button>
  </div>
</ion-content>
